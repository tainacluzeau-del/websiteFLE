<style>
:root{--navy:#1E293B;--coral:#FF5A5F;--coral-dark:#D1343A;--yellow:#FFD166;--mint:#06D6A0;--mint-soft:#CDEFE2;--blue:#118AB2;--cream:#FFFDF7;--white:#fff;--border:#E2E8F0;--shadow:0 10px 25px rgba(30,41,59,.08);--nav-h:56px;--u:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;background:var(--mint-soft);color:var(--navy);-webkit-tap-highlight-color:transparent}
h1,h2,.fr{font-family:'Fredoka',sans-serif}
.page{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden}
@media(min-width:901px){.page{box-shadow:0 0 40px rgba(30,41,59,.12)}}
.bar{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;background:#fff;border-bottom:1px solid var(--border);min-height:var(--nav-h);z-index:5}
.bar a.back{color:var(--navy);text-decoration:none;font-weight:800;font-size:.9rem;white-space:nowrap}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--cream);border:2px solid var(--border);border-radius:99px;padding:.25rem .65rem;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35);background:var(--yellow)}}
.ibtn{border:2px solid var(--border);background:#fff;border-radius:99px;min-width:38px;height:38px;font-family:'Fredoka',sans-serif;font-weight:600;cursor:pointer;font-size:.9rem;color:var(--navy)}
.ibtn:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.scene{position:relative;flex:0 0 44%;min-height:220px;overflow:hidden;background:#8fd3f4;touch-action:pan-y}
.world{position:absolute;left:0;top:0}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mer{position:absolute;left:0;top:0;width:calc(var(--u)*8);height:calc(var(--u)*3);margin-left:calc(var(--u)*-4);margin-top:calc(var(--u)*-1.5);z-index:2;display:none;overflow:visible;pointer-events:none}
.frog{position:absolute;left:0;top:0;width:0;height:0;z-index:3;will-change:transform}
.frog svg{position:absolute;overflow:visible}
.fhead{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);left:calc(var(--u)*-1.1);top:calc(var(--u)*-1.1)}
.fhelm{width:calc(var(--u)*3.8);height:calc(var(--u)*3.8);left:calc(var(--u)*-1.9);top:calc(var(--u)*-1.95);display:none}
.fcrown{width:calc(var(--u)*2.4);height:calc(var(--u)*1.8);left:calc(var(--u)*-1.2);top:calc(var(--u)*-3.7);display:none}
.fsub{width:calc(var(--u)*8);height:calc(var(--u)*6);left:calc(var(--u)*-4);top:calc(var(--u)*-3);display:none}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.p{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
.tray{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:6}
.tray i{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.3);border:1.5px dashed rgba(255,255,255,.55);font-style:normal;font-size:14px;display:flex;align-items:center;justify-content:center}
.tray i.on{background:rgba(255,255,255,.92);border:1.5px solid #FFD166}
.banner{position:absolute;top:44px;left:50%;transform:translate(-50%,-30px);background:var(--yellow);color:var(--navy);font-family:'Fredoka',sans-serif;font-weight:700;padding:.4rem 1rem;border-radius:99px;opacity:0;transition:.5s;z-index:6;white-space:normal;text-align:center;line-height:1.2;box-shadow:var(--shadow);width:max-content;max-width:90%}
.banner.on{opacity:1;transform:translate(-50%,0)}
.alt{position:absolute;left:10px;top:10px;color:#fff;font-family:'Fredoka',sans-serif;font-size:.85rem;background:rgba(0,0,0,.32);padding:.15rem .6rem;border-radius:99px;z-index:6}
.fly{position:fixed;z-index:50;font-size:1.6rem;pointer-events:none}
.panel{flex:1;overflow:auto;padding:.9rem 1rem calc(1rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.7rem}
.meta{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.85rem;color:#64748b}
.lvl{background:var(--navy);color:#fff;border-radius:99px;padding:.1rem .7rem;font-family:'Fredoka',sans-serif}
.dots{display:flex;gap:5px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--border)}
.dots i.ok{background:var(--mint)}.dots i.ko{background:var(--coral)}.dots i.cur{outline:2px solid var(--navy)}
.q{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;line-height:1.35}
.opts{display:grid;gap:.5rem}
.opt{border:2px solid var(--border);background:#fff;border-radius:14px;padding:.75rem 1rem;font:inherit;font-weight:700;font-size:1.05rem;text-align:left;cursor:pointer;color:var(--navy);min-height:48px;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.good{background:#d9f7ea;border-color:var(--mint)}.opt.bad{background:#ffe3e4;border-color:var(--coral)}
.opts.done .opt{cursor:default}
.expl{background:#fff8e1;border-radius:14px;padding:.7rem .9rem;font-size:.95rem;display:none}
.expl.on{display:block}
.btn{border:none;border-radius:99px;padding:.8rem 1.6rem;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;cursor:pointer;background:var(--coral);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.alt2{background:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--border)}
.btn[hidden]{display:none}
.center{text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center}
.center h1{font-size:1.9rem;line-height:1.15}.center p{max-width:30em}
.bd{width:100%;max-width:360px;display:grid;gap:.35rem;text-align:left}
.bd div{display:flex;align-items:center;gap:.6rem;font-weight:700}
.bd b{width:2.2rem;font-family:'Fredoka',sans-serif}.bd .bar2{flex:1;height:10px;background:var(--border);border-radius:9px;overflow:hidden}.bd .bar2 i{display:block;height:100%;background:var(--mint)}
.bigl{font-family:'Fredoka',sans-serif;font-size:2.6rem;font-weight:700;color:var(--coral)}
.spin{animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tw{animation:tw 2.2s infinite alternate}@keyframes tw{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.tw{animation:none}}
</style>
</head>

/* =====================================================================
   BANQUE DE QUESTIONS : c'est ici qu'on ajoute les questions.
   - Une ligne = une question : {q:"énoncé", a:"bonne réponse", w:["fausse 1","fausse 2"], e:"explication courte"}
   - Mettez-la dans le tableau du bon niveau (A1, A2, B1, B2, C1, C2). Il n'y a pas de limite : plus il y en a, plus les parties sont variées.
   - À chaque partie, le jeu tire PER_LEVEL questions au hasard par niveau (les mêmes peuvent revenir d'une partie à l'autre).
   - "w" peut contenir 1, 2 ou 3 mauvaises réponses. Les réponses sont mélangées automatiquement.
   ===================================================================== */

    {q:"Elle ____ une pomme.",a:"mange",w:["manges","mangent"],e:"Sujet « elle » (3e personne du singulier) : elle mange."},
    {q:"____ école est grande.",a:"L'",w:["La","Le"],e:"Devant une voyelle, on écrit « l' » : l'école."},

    // ← ajoutez vos questions A1 ici
  ],
  A2:[

    // ← ajoutez vos questions B1 ici
  ],
  B2:[
    {q:"Bien qu'il ____ fatigué, il a continué à travailler.",a:"soit",w:["est","sera"],e:"« Bien que » est suivi du subjonctif : bien qu'il soit."},
    {q:"Voici le livre ____ je t'ai parlé.",a:"dont",w:["que","où"],e:"« Parler de » → le livre dont je t'ai parlé."},
    {q:"Il m'a dit qu'il ____ déjà mangé.",a:"avait",w:["a","aura"],e:"Concordance des temps : verbe principal au passé → plus-que-parfait : il avait mangé."},
    {q:"____ le mauvais temps, le match a eu lieu.",a:"Malgré",w:["Grâce à","Parce que"],e:"« Malgré » exprime l'opposition : malgré le mauvais temps."},
    {q:"« Mettre son grain de sel » signifie…",a:"Intervenir sans y être invité",w:["Trop saler un plat","Faire des économies"],e:"C'est donner son avis alors qu'on ne vous l'a pas demandé."},
    // ← ajoutez vos questions B2 ici
  ],
  C1:[
    {q:"Quoi qu'il ____, nous resterons calmes.",a:"arrive",w:["arrivera","est arrivé"],e:"« Quoi que » (même si) est suivi du subjonctif : quoi qu'il arrive. Attention : « quoi que » en deux mots."},
    {q:"Les lettres que j'ai ____ sont arrivées.",a:"écrites",w:["écrit","écrits"],e:"Le COD « les lettres » est placé avant le verbe : accord au féminin pluriel."},

    {q:"Elle ____ la porte et sortit.",a:"ouvrit",w:["ouvra","ouvri"],e:"Passé simple d'« ouvrir » : elle ouvrit (verbe conjugué comme un verbe en -er)."},
    {q:"« Revenir à ses moutons » signifie…",a:"revenir au sujet dont on parlait",w:["retourner à la campagne","s'énerver soudainement"],e:"Expression tirée de La Farce de Maître Pathelin : reprendre le sujet principal."},

  C2:[

    {q:"La litote consiste à…",a:"dire moins pour faire entendre plus",w:["exagérer pour impressionner","comparer sans mot de comparaison"],e:"Exemple : « Ce n'est pas mauvais » pour « C'est très bon »."},
    {q:"Ils se sont ____ la main.",a:"serré",w:["serrés","serrée"],e:"Le COD est « la main », placé après : pas d'accord. « Se » est COI."},
    {q:"Quelle est la bonne orthographe ?",a:"rythme",w:["rhytme","rithme"],e:"Le mot s'écrit « rythme », avec « rh » au début et « y » au milieu."},

    // ← ajoutez vos questions C2 ici
  ],
};
